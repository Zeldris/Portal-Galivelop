name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.cambios.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: el lastmod del sitemap sale de la fecha de git de cada dato.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar tipos y tests
        run: npm run check
      - name: Construir
        run: npm run build
      # Antes de desplegar: qué páginas cambian respecto al sitemap publicado (para IndexNow).
      - name: Páginas cambiadas
        id: cambios
        continue-on-error: true
        run: node scripts/indexnow.mjs cambios >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  # Avisa a los buscadores de IndexNow (Bing, Yandex…) de lo que ha cambiado. Si falla, la web ya está publicada.
  avisar:
    needs: [construir, publicar]
    if: needs.construir.outputs.urls != '' && needs.construir.outputs.urls != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IndexNow
        env:
          URLS: ${{ needs.construir.outputs.urls }}
        run: node scripts/indexnow.mjs avisar
