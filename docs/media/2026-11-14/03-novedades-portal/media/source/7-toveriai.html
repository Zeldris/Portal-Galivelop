<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="gw-size" content="1200x1200">
<title>toVeriAI</title>
<style>
  :root { --background: #0b1720; --text: #e6eef3; --muted: #9fb2bf; --accent: #2F7A55; --marca: #1aa6df;
    --font: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Liberation Sans", sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 1200px; overflow: hidden; background: var(--background); color: var(--text); font-family: var(--font); display: flex; flex-direction: column; }
  .img { flex: none; border-bottom: 8px solid var(--accent); }
  .img img { width: 100%; max-height: 700px; object-fit: cover; display: block; }
  .txt { flex: 1; padding: 44px 64px 40px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-size: 18px; letter-spacing: .16em; text-transform: uppercase; color: var(--marca); font-weight: 700; }
  .sub { font-size: 24px; color: var(--accent); font-weight: 700; filter: brightness(1.3); }
  h1 { font-size: 56px; line-height: 1.1; margin-top: 14px; }
  ul { list-style: none; padding: 0; margin: auto 0; display: grid; grid-template-columns: 1fr; gap: 18px; }
  li { font-size: 30px; line-height: 1.3; padding-left: 28px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 13px; width: 15px; height: 15px; background: var(--accent); }
  .footer { margin-top: auto; font-size: 19px; color: var(--muted); }
</style>
</head>
<body>
  <div class="img"><img src="../../../../../../public/proyectos/toveriai/presentacion.webp" alt=""></div>
  <div class="txt">
    <div class="top"><div class="brand">Galivelop · Novedades</div><div class="sub">Trabajo de fondo · noviembre de 2026</div></div>
    <h1>toVeriAI</h1>
    <ul><li>Un servidor que aguanta mejor con pocos recursos</li><li>Herramientas al día con correcciones de seguridad</li><li>Para que la web siga segura y estable</li></ul>
    <div class="footer">zeldris.github.io/Portal-Galivelop/novedades</div>
  </div>
</body>
</html>
