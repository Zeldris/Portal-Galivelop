<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<!-- Fuente de un diagrama de la ficha de Galivelop-workflow, con la hoja de estilos de docs/marca.md (papel,
     retícula de 24 px, tinta, celeste hondo, chaflanes). Se exporta a public/proyectos/galivelop-workflow/
     <nombre>.webp (1600x900) y <nombre>-mini.webp (720x405) con Chromium (.claude/skills/gw-portal/proyectos.md).
     Fuentes: Big Shoulders Display (títulos) y JetBrains Mono (el resto), las de la web. -->
<defs>
  <pattern id="rejilla" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#e3edf3" stroke-width="1"/>
  </pattern>
  <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0072a8"/></marker>
  <marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5c69"/></marker>
  <marker id="fo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1aa6df"/></marker>
  <marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#13212b"/></marker>
  <marker id="fm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d7a6a"/></marker>
</defs>
<style>
  .t { font-family: 'Big Shoulders Display Variable', 'Big Shoulders Display', sans-serif; font-weight: 800; letter-spacing: 0.01em; }
  .s { font-family: 'Literata Variable', Literata, serif; font-weight: 600; }
  .m { font-family: 'JetBrains Mono Variable', 'JetBrains Mono', monospace; }
</style>
<rect width="1600" height="900" fill="#fbfcfd"/>
<rect width="1600" height="900" fill="url(#rejilla)"/>
<text x="80" y="92" class="t" font-size="46" fill="#13212b" text-anchor="start">RELEASE LOOP</text>
<text x="82" y="132" class="m" font-size="20" fill="#4a5c69" text-anchor="start">improve once, reach every project · local customisations are never overwritten</text>
<path d="M600 180H986L1000 194V350H600Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<path d="M620 198H650V203H620Z" fill="#0072a8"/>
<text x="620" y="238" class="m" font-size="22" fill="#13212b" font-weight="bold" text-anchor="start">galivelop-workflow</text>
<text x="620" y="268" class="m" font-size="16" fill="#4a5c69" text-anchor="start">vX.Y.Z · plugin.json</text>
<text x="620" y="292" class="m" font-size="16" fill="#4a5c69" text-anchor="start">CHANGELOG · pytest + shellcheck</text>
<text x="620" y="316" class="m" font-size="16" fill="#4a5c69" text-anchor="start">Linux + macOS CI</text>
<path d="M1120 400H1506L1520 414V590H1120Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<path d="M1140 418H1170V423H1140Z" fill="#0072a8"/>
<text x="1140" y="458" class="m" font-size="20" fill="#13212b" font-weight="bold" text-anchor="start">apply.py --update</text>
<text x="1140" y="488" class="m" font-size="16" fill="#4a5c69" text-anchor="start">/gw-update: diff first,</text>
<text x="1140" y="512" class="m" font-size="16" fill="#4a5c69" text-anchor="start">person confirms</text>
<text x="1140" y="536" class="m" font-size="16" fill="#4a5c69" text-anchor="start">local edit → *.gw-new</text>
<text x="1140" y="560" class="m" font-size="16" fill="#4a5c69" text-anchor="start">then doctor.py</text>
<path d="M600 640H986L1000 654V830H600Z" fill="#ffffff" stroke="#4a5c69" stroke-width="2"/>
<path d="M620 658H650V663H620Z" fill="#4a5c69"/>
<text x="620" y="698" class="m" font-size="22" fill="#13212b" font-weight="bold" text-anchor="start">projects</text>
<text x="620" y="728" class="m" font-size="16" fill="#4a5c69" text-anchor="start">.claude/gw/ · .githooks/</text>
<text x="620" y="752" class="m" font-size="16" fill="#4a5c69" text-anchor="start">.claude/gw.json (own keys)</text>
<text x="620" y="776" class="m" font-size="16" fill="#4a5c69" text-anchor="start">own skills, own retros</text>
<path d="M80 400H466L480 414V590H80Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<path d="M100 418H130V423H100Z" fill="#0072a8"/>
<text x="100" y="458" class="m" font-size="20" fill="#13212b" font-weight="bold" text-anchor="start">harvest.py</text>
<text x="100" y="488" class="m" font-size="16" fill="#4a5c69" text-anchor="start">/gw-harvest: diffs, new</text>
<text x="100" y="512" class="m" font-size="16" fill="#4a5c69" text-anchor="start">skills, retro notes</text>
<text x="100" y="536" class="m" font-size="16" fill="#4a5c69" text-anchor="start">→ docs/proposals/*.md</text>
<text x="100" y="560" class="m" font-size="16" fill="#4a5c69" text-anchor="start">person approves</text>
<path d="M1000 265C1200 265 1320 300 1320 392" fill="none" stroke="#0072a8" stroke-width="2.5" marker-end="url(#fa)"/>
<path d="M1320 590C1320 700 1200 735 1008 735" fill="none" stroke="#0072a8" stroke-width="2.5" marker-end="url(#fa)"/>
<path d="M600 735C400 735 280 700 280 598" fill="none" stroke="#0072a8" stroke-width="2.5" marker-end="url(#fa)"/>
<path d="M280 400C280 300 400 265 592 265" fill="none" stroke="#0072a8" stroke-width="2.5" marker-end="url(#fa)"/>
<text x="1295" y="372" class="m" font-size="18" fill="#0072a8" font-weight="bold" text-anchor="end">release</text>
<text x="1295" y="620" class="m" font-size="18" fill="#0072a8" font-weight="bold" text-anchor="end">apply</text>
<text x="305" y="620" class="m" font-size="18" fill="#0072a8" font-weight="bold" text-anchor="start">harvest</text>
<text x="305" y="372" class="m" font-size="18" fill="#0072a8" font-weight="bold" text-anchor="start">version.py --release</text>
<text x="800" y="470" class="m" font-size="22" fill="#13212b" font-weight="bold" text-anchor="middle">gw-init</text>
<text x="800" y="500" class="m" font-size="16" fill="#4a5c69" text-anchor="middle">apply.py --init</text>
<text x="800" y="540" class="m" font-size="22" fill="#13212b" font-weight="bold" text-anchor="middle">gw-doctor</text>
<text x="800" y="570" class="m" font-size="16" fill="#4a5c69" text-anchor="middle">OK · WARN · FAIL + fix</text>
<path d="M800 580V632" fill="none" stroke="#4a5c69" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#fg)"/>
<path d="M800 358V448" stroke="#4a5c69" stroke-width="2" stroke-dasharray="7 6"/>
</svg>
