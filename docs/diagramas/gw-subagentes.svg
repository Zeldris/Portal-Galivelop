<text x="720" y="621" class="m" font-size="15" fill="#4a5c69" text-anchor="start">≤ ~25 tool calls</text>
<path d="M460 510C580 510 580 575 692 575" fill="none" stroke="#0072a8" stroke-width="2" marker-end="url(#fa)"/>
<text x="535" y="500" class="m" font-size="18" fill="#0072a8" font-weight="bold" text-anchor="start">brief</text>
<text x="470" y="700" class="m" font-size="16" fill="#4a5c69" text-anchor="start">brief = goal · paths · “done when” · check · do-not · reply format</text>
