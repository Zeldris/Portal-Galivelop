<text x="1200" y="512" class="m" font-size="16" fill="#4a5c69" text-anchor="start">merge-branch.sh &lt;branch&gt;</text>
<text x="1200" y="536" class="m" font-size="16" fill="#4a5c69" text-anchor="start">→ main session decides</text>
