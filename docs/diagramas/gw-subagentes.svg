<text x="100" y="512" class="m" font-size="16" fill="#4a5c69" text-anchor="start">plans · decides</text>
<text x="100" y="536" class="m" font-size="16" fill="#4a5c69" text-anchor="start">reviews every diff</text>
<text x="100" y="560" class="m" font-size="16" fill="#4a5c69" text-anchor="start">talks to the person</text>
