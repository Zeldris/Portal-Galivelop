<text x="661.3820000000001" y="756" class="m" font-size="17" fill="#13212b" text-anchor="start">opus medium</text>
<path d="M793.9560000000001 754H827.9560000000001" fill="none" stroke="#4a5c69" stroke-width="2" marker-end="url(#fg)"/>
<path d="M835.956 734H941.956L955.956 748V773H835.956Z" fill="#5d7a6a" fill-opacity="0.08" stroke="#5d7a6a" stroke-width="1.5"/>
<text x="849.9560000000001" y="756" class="m" font-size="17" fill="#13212b" text-anchor="start">opus high</text>
<text x="80" y="820" class="m" font-size="17" fill="#4a5c69" text-anchor="start">start at the cheapest step that fits · one failure → one step up · two failures on a step → stop and ask</text>
<text x="80" y="850" class="m" font-size="17" fill="#4a5c69" text-anchor="start">context over ~150k → write the handoff and recommend /clear</text>
