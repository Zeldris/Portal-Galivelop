<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<!-- Fuente de un diagrama de la ficha de Galivelop-workflow. Se exporta a public/proyectos/galivelop-workflow/
     <nombre>.webp (1600x900) y <nombre>-mini.webp (720x405) con Chromium. Fuentes: Inter y DejaVu Sans Mono. -->
<defs>
  <radialGradient id="fondo" cx="0.1" cy="0" r="0.9">
    <stop offset="0" stop-color="#0e2a42"/><stop offset="0.6" stop-color="#08151f"/><stop offset="1" stop-color="#06121b"/>
  </radialGradient>
  <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
  </pattern>
  <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38b6e8"/></marker>
  <marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a9bb0"/></marker>
  <marker id="fo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4cc38a"/></marker>
  <marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f0716a"/></marker>
  <marker id="fm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2b34a"/></marker>
</defs>
<style>
  .t { font-family: Inter, sans-serif; font-weight: 800; }
  .s { font-family: Inter, sans-serif; font-weight: 600; }
  .m { font-family: 'DejaVu Sans Mono', monospace; }
</style>
<rect width="1600" height="900" fill="url(#fondo)"/>
<rect width="1600" height="900" fill="url(#rejilla)"/>
<text x="80" y="92" class="t" font-size="46" fill="#eef6fb" text-anchor="start">pre-push gate</text>
<text x="82" y="132" class="m" font-size="20" fill="#8a9bb0" text-anchor="start">git hook · bash 3.2 · judges the pushed commit, not the working tree · fails closed</text>
<rect x="80" y="330" width="146" height="190" rx="14" fill="#0d1b2a" stroke="#38b6e8" stroke-opacity="0.55" stroke-width="2"/>
<text x="94" y="370" class="m" font-size="18" fill="#eef6fb" font-weight="bold" text-anchor="start">push refs</text>
<text x="94" y="410" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">per ref</text>
<text x="94" y="436" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">skip tags</text>
<text x="94" y="462" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">and deletes</text>
<path d="M226 425H238" fill="none" stroke="#38b6e8" stroke-width="2" marker-end="url(#fa)"/>
<rect x="240" y="330" width="146" height="190" rx="14" fill="#0d1b2a" stroke="#38b6e8" stroke-opacity="0.55" stroke-width="2"/>
<text x="254" y="370" class="m" font-size="18" fill="#eef6fb" font-weight="bold" text-anchor="start">commit</text>
<text x="254" y="410" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">must exist</text>
<text x="254" y="436" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">shallow →</text>
<text x="254" y="462" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">fail</text>
<path d="M386 425H398" fill="none" stroke="#38b6e8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M313.0 520V632" fill="none" stroke="#f0716a" stroke-width="2" marker-end="url(#fk)"/>
<rect x="400" y="330" width="146" height="190" rx="14" fill="#0d1b2a" stroke="#38b6e8" stroke-opacity="0.55" stroke-width="2"/>
<text x="414" y="370" class="m" font-size="18" fill="#eef6fb" font-weight="bold" text-anchor="start">config@sha</text>
<text x="414" y="410" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">check and</text>
<text x="414" y="436" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">protected</text>
<text x="414" y="462" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">from commit</text>
<path d="M546 425H558" fill="none" stroke="#38b6e8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M473.0 520V632" fill="none" stroke="#f0716a" stroke-width="2" marker-end="url(#fk)"/>
<rect x="560" y="330" width="146" height="190" rx="14" fill="#0d1b2a" stroke="#38b6e8" stroke-opacity="0.55" stroke-width="2"/>
<text x="574" y="370" class="m" font-size="18" fill="#eef6fb" font-weight="bold" text-anchor="start">leftovers</text>
<text x="574" y="410" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
<text x="574" y="436" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">*.rej</text>
<text x="574" y="462" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">*.orig</text>
<path d="M706 425H718" fill="none" stroke="#38b6e8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M633.0 520V632" fill="none" stroke="#f0716a" stroke-width="2" marker-end="url(#fk)"/>
<rect x="720" y="330" width="146" height="190" rx="14" fill="#0d1b2a" stroke="#38b6e8" stroke-opacity="0.55" stroke-width="2"/>
<text x="734" y="370" class="m" font-size="18" fill="#eef6fb" font-weight="bold" text-anchor="start">check@sha</text>
<text x="734" y="410" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">temp work-</text>
<text x="734" y="436" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">tree, uid,</text>
<text x="734" y="462" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">mode 700</text>
<path d="M866 425H878" fill="none" stroke="#38b6e8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M793.0 520V632" fill="none" stroke="#f0716a" stroke-width="2" marker-end="url(#fk)"/>
<rect x="880" y="330" width="146" height="190" rx="14" fill="#0d1b2a" stroke="#f2b34a" stroke-opacity="0.55" stroke-width="2"/>
<text x="894" y="370" class="m" font-size="18" fill="#eef6fb" font-weight="bold" text-anchor="start">protected?</text>
<text x="894" y="410" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">policy from</text>
<text x="894" y="436" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">REMOTE tip</text>
<text x="894" y="462" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">gw.json</text>
<path d="M1026 425H1038" fill="none" stroke="#38b6e8" stroke-width="2" marker-end="url(#fa)"/>
<rect x="1040" y="330" width="146" height="190" rx="14" fill="#0d1b2a" stroke="#f2b34a" stroke-opacity="0.55" stroke-width="2"/>
<text x="1054" y="370" class="m" font-size="18" fill="#eef6fb" font-weight="bold" text-anchor="start">code files?</text>
<text x="1054" y="410" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">es-codigo.sh</text>
<text x="1054" y="436" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">content</text>
<text x="1054" y="462" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">regexes</text>
<path d="M1186 425H1198" fill="none" stroke="#38b6e8" stroke-width="2" marker-end="url(#fa)"/>
<rect x="1200" y="330" width="146" height="190" rx="14" fill="#0d1b2a" stroke="#38b6e8" stroke-opacity="0.55" stroke-width="2"/>
<text x="1214" y="370" class="m" font-size="18" fill="#eef6fb" font-weight="bold" text-anchor="start">review mark</text>
<text x="1214" y="410" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">sha exists</text>
<text x="1214" y="436" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">is ancestor</text>
<text x="1214" y="462" class="m" font-size="15" fill="#8a9bb0" text-anchor="start">no code after</text>
<path d="M1273.0 520V632" fill="none" stroke="#f0716a" stroke-width="2" marker-end="url(#fk)"/>
<rect x="1386" y="330" width="134" height="190" rx="14" fill="#0b2120" stroke="#4cc38a" stroke-opacity="0.7" stroke-width="2"/>
<text x="1453.0" y="415" class="m" font-size="44" fill="#4cc38a" font-weight="bold" text-anchor="middle">✓</text>
<text x="1453.0" y="460" class="m" font-size="18" fill="#eef6fb" text-anchor="middle">all green</text>
<path d="M1346 425H1378" fill="none" stroke="#4cc38a" stroke-width="2" marker-end="url(#fo)"/>
<path d="M953.0 330C953.0 200 1453.0 200 1453.0 324" fill="none" stroke="#4cc38a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#fo)"/>
<text x="1200" y="218" class="m" font-size="16" fill="#4cc38a" text-anchor="middle">not protected → check only</text>
<path d="M1113.0 330C1113.0 290 1413.0 290 1413.0 324" fill="none" stroke="#4cc38a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#fo)"/>
<text x="1270" y="286" class="m" font-size="16" fill="#4cc38a" text-anchor="middle">content only</text>
<rect x="80" y="640" width="1440" height="120" rx="14" fill="#2a1215" stroke="#f0716a" stroke-opacity="0.7" stroke-width="2"/>
<text x="110" y="690" class="m" font-size="24" fill="#eef6fb" font-weight="bold" text-anchor="start">✗ push rejected · exit 1</text>
<text x="110" y="726" class="m" font-size="17" fill="#e9c3c0" text-anchor="start">reason on stderr · last line is the fix:  /code-review → bash .claude/gw/scripts/revisado.sh → git push</text>
<text x="80" y="820" class="m" font-size="17" fill="#8a9bb0" text-anchor="start">pushToProtected: pr → a PreToolUse hook asks the same mark, plus green CI, before a PR is created or merged (exit 2).</text>
<text x="80" y="850" class="m" font-size="17" fill="#8a9bb0" text-anchor="start">A commit cannot unprotect the branch it is judged on: the policy is read from the remote tip.</text>
</svg>
