<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<!-- Fuente de un diagrama de la ficha de Galivelop-workflow, con la hoja de estilos de docs/marca.md (papel,
     retícula de 24 px, tinta, celeste hondo, chaflanes). Se exporta a public/proyectos/galivelop-workflow/
     <nombre>.webp (1600x900) y <nombre>-mini.webp (720x405) con Chromium (.claude/skills/gw-portal/proyectos.md).
     Fuentes: Big Shoulders Display (títulos) y JetBrains Mono (el resto), las de la web. -->
<defs>
  <pattern id="rejilla" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#e3edf3" stroke-width="1"/>
  </pattern>
  <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0072a8"/></marker>
  <marker id="fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5c69"/></marker>
  <marker id="fo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1aa6df"/></marker>
  <marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#13212b"/></marker>
  <marker id="fm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d7a6a"/></marker>
</defs>
<style>
  .t { font-family: 'Big Shoulders Display Variable', 'Big Shoulders Display', sans-serif; font-weight: 800; letter-spacing: 0.01em; }
  .s { font-family: 'Literata Variable', Literata, serif; font-weight: 600; }
  .m { font-family: 'JetBrains Mono Variable', 'JetBrains Mono', monospace; }
</style>
<rect width="1600" height="900" fill="#fbfcfd"/>
<rect width="1600" height="900" fill="url(#rejilla)"/>
<text x="80" y="92" class="t" font-size="46" fill="#13212b" text-anchor="start">PRE-PUSH GATE</text>
<text x="82" y="132" class="m" font-size="20" fill="#4a5c69" text-anchor="start">git hook · bash 3.2 · judges the pushed commit, not the working tree · fails closed</text>
<path d="M80 330H212L226 344V520H80Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<text x="94" y="370" class="m" font-size="18" fill="#13212b" font-weight="bold" text-anchor="start">push refs</text>
<text x="94" y="410" class="m" font-size="15" fill="#4a5c69" text-anchor="start">per ref</text>
<text x="94" y="436" class="m" font-size="15" fill="#4a5c69" text-anchor="start">skip tags</text>
<text x="94" y="462" class="m" font-size="15" fill="#4a5c69" text-anchor="start">and deletes</text>
<path d="M226 425H238" fill="none" stroke="#0072a8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M240 330H372L386 344V520H240Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<text x="254" y="370" class="m" font-size="18" fill="#13212b" font-weight="bold" text-anchor="start">commit</text>
<text x="254" y="410" class="m" font-size="15" fill="#4a5c69" text-anchor="start">must exist</text>
<text x="254" y="436" class="m" font-size="15" fill="#4a5c69" text-anchor="start">shallow →</text>
<text x="254" y="462" class="m" font-size="15" fill="#4a5c69" text-anchor="start">fail</text>
<path d="M386 425H398" fill="none" stroke="#0072a8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M313.0 520V632" fill="none" stroke="#13212b" stroke-width="2" marker-end="url(#fk)"/>
<path d="M400 330H532L546 344V520H400Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<text x="414" y="370" class="m" font-size="18" fill="#13212b" font-weight="bold" text-anchor="start">config@sha</text>
<text x="414" y="410" class="m" font-size="15" fill="#4a5c69" text-anchor="start">check and</text>
<text x="414" y="436" class="m" font-size="15" fill="#4a5c69" text-anchor="start">protected</text>
<text x="414" y="462" class="m" font-size="15" fill="#4a5c69" text-anchor="start">from commit</text>
<path d="M546 425H558" fill="none" stroke="#0072a8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M473.0 520V632" fill="none" stroke="#13212b" stroke-width="2" marker-end="url(#fk)"/>
<path d="M560 330H692L706 344V520H560Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<text x="574" y="370" class="m" font-size="18" fill="#13212b" font-weight="bold" text-anchor="start">leftovers</text>
<text x="574" y="410" class="m" font-size="15" fill="#4a5c69" text-anchor="start">&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
<text x="574" y="436" class="m" font-size="15" fill="#4a5c69" text-anchor="start">*.rej</text>
<text x="574" y="462" class="m" font-size="15" fill="#4a5c69" text-anchor="start">*.orig</text>
<path d="M706 425H718" fill="none" stroke="#0072a8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M633.0 520V632" fill="none" stroke="#13212b" stroke-width="2" marker-end="url(#fk)"/>
<path d="M720 330H852L866 344V520H720Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<text x="734" y="370" class="m" font-size="18" fill="#13212b" font-weight="bold" text-anchor="start">check@sha</text>
<text x="734" y="410" class="m" font-size="15" fill="#4a5c69" text-anchor="start">temp work-</text>
<text x="734" y="436" class="m" font-size="15" fill="#4a5c69" text-anchor="start">tree, uid,</text>
<text x="734" y="462" class="m" font-size="15" fill="#4a5c69" text-anchor="start">mode 700</text>
<path d="M866 425H878" fill="none" stroke="#0072a8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M793.0 520V632" fill="none" stroke="#13212b" stroke-width="2" marker-end="url(#fk)"/>
<path d="M880 330H1012L1026 344V520H880Z" fill="#ffffff" stroke="#5d7a6a" stroke-width="2"/>
<text x="894" y="370" class="m" font-size="18" fill="#13212b" font-weight="bold" text-anchor="start">protected?</text>
<text x="894" y="410" class="m" font-size="15" fill="#4a5c69" text-anchor="start">policy from</text>
<text x="894" y="436" class="m" font-size="15" fill="#4a5c69" text-anchor="start">REMOTE tip</text>
<text x="894" y="462" class="m" font-size="15" fill="#4a5c69" text-anchor="start">gw.json</text>
<path d="M1026 425H1038" fill="none" stroke="#0072a8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M1040 330H1172L1186 344V520H1040Z" fill="#ffffff" stroke="#5d7a6a" stroke-width="2"/>
<text x="1054" y="370" class="m" font-size="18" fill="#13212b" font-weight="bold" text-anchor="start">code files?</text>
<text x="1054" y="410" class="m" font-size="15" fill="#4a5c69" text-anchor="start">is-code.sh</text>
<text x="1054" y="436" class="m" font-size="15" fill="#4a5c69" text-anchor="start">content</text>
<text x="1054" y="462" class="m" font-size="15" fill="#4a5c69" text-anchor="start">regexes</text>
<path d="M1186 425H1198" fill="none" stroke="#0072a8" stroke-width="2" marker-end="url(#fa)"/>
<path d="M1200 330H1332L1346 344V520H1200Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<text x="1214" y="370" class="m" font-size="18" fill="#13212b" font-weight="bold" text-anchor="start">review mark</text>
<text x="1214" y="410" class="m" font-size="15" fill="#4a5c69" text-anchor="start">sha exists</text>
<text x="1214" y="436" class="m" font-size="15" fill="#4a5c69" text-anchor="start">is ancestor</text>
<text x="1214" y="462" class="m" font-size="15" fill="#4a5c69" text-anchor="start">no code after</text>
<path d="M1273.0 520V632" fill="none" stroke="#13212b" stroke-width="2" marker-end="url(#fk)"/>
<path d="M1386 330H1506L1520 344V520H1386Z" fill="#ffffff" stroke="#1aa6df" stroke-width="2"/>
<text x="1453.0" y="415" class="m" font-size="44" fill="#1aa6df" font-weight="bold" text-anchor="middle">✓</text>
<text x="1453.0" y="460" class="m" font-size="18" fill="#13212b" text-anchor="middle">all green</text>
<path d="M1346 425H1378" fill="none" stroke="#1aa6df" stroke-width="2" marker-end="url(#fo)"/>
<path d="M953.0 330C953.0 200 1453.0 200 1453.0 324" fill="none" stroke="#1aa6df" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#fo)"/>
<text x="1200" y="218" class="m" font-size="16" fill="#1aa6df" text-anchor="middle">not protected → check only</text>
<path d="M1113.0 330C1113.0 290 1413.0 290 1413.0 324" fill="none" stroke="#1aa6df" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#fo)"/>
<text x="1270" y="286" class="m" font-size="16" fill="#1aa6df" text-anchor="middle">content only</text>
<path d="M80 640H1492L1520 668V760H80Z" fill="#ffffff" stroke="#13212b" stroke-width="2"/>
<text x="110" y="690" class="m" font-size="24" fill="#13212b" font-weight="bold" text-anchor="start">✗ push rejected · exit 1</text>
<text x="110" y="726" class="m" font-size="17" fill="#13212b" text-anchor="start">reason on stderr · last line is the fix:  /code-review → bash .claude/gw/scripts/reviewed.sh → git push</text>
<text x="80" y="820" class="m" font-size="17" fill="#4a5c69" text-anchor="start">pushToProtected: pr → a PreToolUse hook asks the same mark, plus green CI, before a PR is created or merged (exit 2).</text>
<text x="80" y="850" class="m" font-size="17" fill="#4a5c69" text-anchor="start">A commit cannot unprotect the branch it is judged on: the policy is read from the remote tip.</text>
</svg>
