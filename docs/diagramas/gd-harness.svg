<path d="M60 210H346L360 224V262H60Z" fill="#0072a8"/>
<text x="84" y="250" class="t" font-size="38" fill="#ffffff" text-anchor="start">TU MÁQUINA</text>
<text x="388" y="246" class="m" font-size="22" fill="#4a5c69" text-anchor="start">tu código y tus datos no salen de aquí</text>
