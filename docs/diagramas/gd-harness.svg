<text x="1214" y="922" class="t" font-size="40" fill="#ffffff" text-anchor="start">TÚ MANDAS</text>
<text x="1214" y="966" class="s" font-size="24" fill="#ffffff" text-anchor="start">Nada entra sin tu sí.</text>
</svg>
