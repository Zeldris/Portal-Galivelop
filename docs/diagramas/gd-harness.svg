<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<!-- Galivelop Developer: cómo funciona el harness local de punta a punta. Hoja de estilos de docs/marca.md (papel, retícula de 24 px, tinta, celeste, chaflanes; sin círculos).
     Lo dibuja scripts/diagramas/productos.py (tema claro y oscuro): no se edita a mano.
     Se exporta con scripts/diagramas-webp.mjs a public/productos/<slug>/<nombre>.webp (1600) y -mini.webp (720).
     Fuentes: Big Shoulders Display (títulos), Literata (frases) y JetBrains Mono (datos), las de la web. -->
<defs>
  <pattern id="rejilla" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#eef3f6" stroke-width="1"/>
  </pattern>
  <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0072a8"/></marker>
  <marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#13212b"/></marker>
  <marker id="fm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d7a6a"/></marker>
</defs>
<style>
  .t { font-family: 'Big Shoulders Display Variable', 'Big Shoulders Display', sans-serif; font-weight: 800; letter-spacing: 0.01em; }
  .s { font-family: 'Literata Variable', Literata, serif; font-weight: 500; }
  .m { font-family: 'JetBrains Mono Variable', 'JetBrains Mono', monospace; font-weight: 500; }
  .b { font-weight: 700; }
</style>
<rect width="1600" height="1050" fill="#fbfcfd"/>
<rect width="1600" height="1050" fill="url(#rejilla)"/>
<text x="62" y="66" class="m b" font-size="22" fill="#0072a8" text-anchor="start" letter-spacing="0.08em">GALIVELOP DEVELOPER · HARNESS LOCAL</text>
<text x="60" y="132" class="t" font-size="64" fill="#13212b" text-anchor="start">TU FLUJO DE TRABAJO, CON IA EN TU MÁQUINA</text>
<text x="62" y="176" class="s" font-size="27" fill="#4a5c69" text-anchor="start">Agentes locales llevan el trabajo del proyecto. Tú decides qué entra.</text>
