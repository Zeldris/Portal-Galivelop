<text x="462" y="922" class="t" font-size="40" fill="#ffffff" text-anchor="start">SIN FACTURA POR USO</text>
<text x="462" y="966" class="s" font-size="24" fill="#ffffff" text-anchor="start">Trabaja tu propio equipo.</text>
<path d="M812 860H1150L1164 874V1000H812Z" fill="#0072a8" stroke="#0072a8" stroke-width="2"/>
<text x="838" y="922" class="t" font-size="40" fill="#ffffff" text-anchor="start">CON MÉTODO</text>
<text x="838" y="966" class="s" font-size="24" fill="#ffffff" text-anchor="start">Plan, revisión y pruebas.</text>
