<path d="M1349 642V768" fill="none" stroke="#0072a8" stroke-width="3" marker-end="url(#fa)"/>
<path d="M629 784L640 773L651 784L640 795Z" fill="#fbfcfd" stroke="#13212b" stroke-width="3"/><path d="M1337 784L1349 772L1361 784L1349 796Z" fill="#0072a8"/>
<text x="1372" y="762" class="m b" font-size="22" fill="#0072a8" text-anchor="start">✓ entra</text>
<path d="M60 860H398L412 874V1000H60Z" fill="#0072a8" stroke="#0072a8" stroke-width="2"/>
<text x="86" y="922" class="t" font-size="40" fill="#ffffff" text-anchor="start">PRIVADO</text>
<text x="86" y="966" class="s" font-size="24" fill="#ffffff" text-anchor="start">Tu código no sale de casa.</text>
