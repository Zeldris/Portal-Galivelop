<text x="114" y="452" class="m b" font-size="22" fill="#0072a8" text-anchor="start">01</text>
<text x="114" y="500" class="t" font-size="42" fill="#13212b" text-anchor="start">QUIEN ORGANIZA</text>
<text x="114" y="538" class="s" font-size="25" fill="#4a5c69" text-anchor="start">Reparte la tarea</text>
<text x="114" y="570" class="s" font-size="25" fill="#4a5c69" text-anchor="start">y fija los límites.</text>
<text x="114" y="625" class="m b" font-size="21" fill="#0072a8" text-anchor="start" letter-spacing="0.06em">MODELO LOCAL</text>
<path d="M617 374V404" fill="none" stroke="#5d7a6a" stroke-width="2.5" marker-end="url(#fm)"/>
<path d="M456 412H764L778 426V642H456Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<path d="M456 590H778V642H456Z" fill="#1aa6df" fill-opacity="0.16" stroke="#0072a8" stroke-width="2"/>
<text x="480" y="452" class="m b" font-size="22" fill="#0072a8" text-anchor="start">02</text>
<text x="480" y="500" class="t" font-size="42" fill="#13212b" text-anchor="start">QUIEN HACE</text>
<text x="480" y="538" class="s" font-size="25" fill="#4a5c69" text-anchor="start">Hace el cambio</text>
<text x="480" y="570" class="s" font-size="25" fill="#4a5c69" text-anchor="start">en una copia aparte.</text>
<text x="480" y="625" class="m b" font-size="21" fill="#0072a8" text-anchor="start" letter-spacing="0.06em">MODELO LOCAL</text>
<path d="M983 374V404" fill="none" stroke="#5d7a6a" stroke-width="2.5" marker-end="url(#fm)"/>
<path d="M822 412H1130L1144 426V642H822Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<path d="M822 590H1144V642H822Z" fill="#1aa6df" fill-opacity="0.16" stroke="#0072a8" stroke-width="2"/>
<text x="846" y="452" class="m b" font-size="22" fill="#0072a8" text-anchor="start">03</text>
<text x="846" y="500" class="t" font-size="42" fill="#13212b" text-anchor="start">QUIEN REVISA</text>
<text x="846" y="538" class="s" font-size="25" fill="#4a5c69" text-anchor="start">Pruebas y revisión</text>
<text x="846" y="570" class="s" font-size="25" fill="#4a5c69" text-anchor="start">antes de integrar.</text>
<text x="846" y="625" class="m b" font-size="21" fill="#0072a8" text-anchor="start" letter-spacing="0.06em">MODELO LOCAL</text>
<path d="M1188 412H1496L1510 426V642H1188Z" fill="#13212b" stroke="#13212b" stroke-width="2"/>
<path d="M1188 590H1510V642H1188Z" fill="#1aa6df" stroke="#1aa6df" stroke-width="2"/>
<text x="1212" y="452" class="m b" font-size="22" fill="#1aa6df" text-anchor="start">04</text>
<text x="1212" y="500" class="t" font-size="42" fill="#ffffff" text-anchor="start">TÚ DECIDES</text>
<text x="1212" y="538" class="s" font-size="25" fill="#e6eef3" text-anchor="start">Das el visto bueno</text>
<text x="1212" y="570" class="s" font-size="25" fill="#e6eef3" text-anchor="start">y el cambio entra.</text>
<text x="1212" y="625" class="m b" font-size="21" fill="#13212b" text-anchor="start" letter-spacing="0.06em">LA ÚLTIMA PALABRA</text>
<path d="M415 500H449" fill="none" stroke="#0072a8" stroke-width="3" marker-end="url(#fa)"/>
<path d="M781 478H815" fill="none" stroke="#0072a8" stroke-width="3" marker-end="url(#fa)"/>
<path d="M819 532H785" fill="none" stroke="#13212b" stroke-width="3" marker-end="url(#fk)"/>
<text x="800.0" y="570" class="m b" font-size="28" fill="#13212b" text-anchor="middle">✗</text>
<path d="M1147 500H1181" fill="none" stroke="#0072a8" stroke-width="3" marker-end="url(#fa)"/>
<path d="M90 654V664H1144V654" fill="none" stroke="#0072a8" stroke-width="2"/>
<text x="617" y="698" class="s" font-size="25" fill="#13212b" text-anchor="middle">Cada papel, el modelo local que mejor rinde en tu equipo: medido, no a ojo.</text>
<text x="90" y="756" class="m b" font-size="21" fill="#13212b" text-anchor="start" letter-spacing="0.06em">TU PROYECTO</text>
<text x="262" y="756" class="m" font-size="21" fill="#4a5c69" text-anchor="start">la versión buena no se toca</text>
