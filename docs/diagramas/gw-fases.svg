<text x="80" y="762" class="m" font-size="17" fill="#4a5c69" text-anchor="start">Each phase leaves a file in the repo: the next session, or a reviewer, sees what was decided.</text>
<text x="80" y="792" class="m" font-size="17" fill="#4a5c69" text-anchor="start">requireRetro: reviewed.sh refuses the mark until a retro on the branch says applied, rejected or deferred.</text>
<text x="80" y="822" class="m" font-size="17" fill="#4a5c69" text-anchor="start">Phase 2 is optional for small changes when the project says so (requireRetro: false).</text>
