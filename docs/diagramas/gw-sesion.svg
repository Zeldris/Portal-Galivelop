<text x="470" y="278" class="m" font-size="16" fill="#4a5c69" text-anchor="start">core.hooksPath</text>
<text x="470" y="302" class="m" font-size="16" fill="#4a5c69" text-anchor="start">cloud: install + setup</text>
<text x="470" y="326" class="m" font-size="16" fill="#4a5c69" text-anchor="start">timeout 900 s</text>
<path d="M850 190H1136L1150 204V340H850Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<path d="M870 208H900V213H870Z" fill="#0072a8"/>
