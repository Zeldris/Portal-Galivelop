<text x="870" y="278" class="m" font-size="16" fill="#4a5c69" text-anchor="start">read handoff.md</text>
<text x="870" y="302" class="m" font-size="16" fill="#4a5c69" text-anchor="start">git fetch · check</text>
<path d="M1220 190H1506L1520 204V520H1220Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<path d="M1240 208H1270V213H1240Z" fill="#0072a8"/>
<text x="1240" y="248" class="m" font-size="22" fill="#13212b" font-weight="bold" text-anchor="start">work</text>
<path d="M1240 290H1361L1375 304V328H1240Z" fill="#0072a8" fill-opacity="0.08" stroke="#0072a8" stroke-width="1.5"/>
<text x="1254" y="311" class="m" font-size="16" fill="#13212b" text-anchor="start">gw-selector</text>
<path d="M1240 340H1341L1355 354V378H1240Z" fill="#0072a8" fill-opacity="0.08" stroke="#0072a8" stroke-width="1.5"/>
<text x="1254" y="361" class="m" font-size="16" fill="#13212b" text-anchor="start">dealer ×n</text>
<path d="M1240 390H1370L1384 404V428H1240Z" fill="#0072a8" fill-opacity="0.08" stroke="#0072a8" stroke-width="1.5"/>
<text x="1254" y="411" class="m" font-size="16" fill="#13212b" text-anchor="start">commit + log</text>
<path d="M1240 440H1350L1364 454V478H1240Z" fill="#4a5c69" fill-opacity="0.08" stroke="#4a5c69" stroke-width="1.5"/>
<text x="1254" y="461" class="m" font-size="16" fill="#13212b" text-anchor="start">pre-commit</text>
<path d="M380 265H442" fill="none" stroke="#0072a8" stroke-width="2.5" marker-end="url(#fa)"/>
<path d="M780 265H842" fill="none" stroke="#0072a8" stroke-width="2.5" marker-end="url(#fa)"/>
<path d="M1150 265H1212" fill="none" stroke="#0072a8" stroke-width="2.5" marker-end="url(#fa)"/>
<path d="M850 420H1136L1150 434V570H850Z" fill="#ffffff" stroke="#4a5c69" stroke-width="2"/>
<path d="M870 438H900V443H870Z" fill="#4a5c69"/>
<text x="870" y="478" class="m" font-size="22" fill="#13212b" font-weight="bold" text-anchor="start">/compact · /clear</text>
<text x="870" y="508" class="m" font-size="16" fill="#4a5c69" text-anchor="start">context window</text>
<text x="870" y="532" class="m" font-size="16" fill="#4a5c69" text-anchor="start">200k cap</text>
<path d="M450 420H766L780 434V570H450Z" fill="#ffffff" stroke="#0072a8" stroke-width="2"/>
<path d="M470 438H500V443H470Z" fill="#0072a8"/>
<text x="470" y="478" class="m" font-size="22" fill="#13212b" font-weight="bold" text-anchor="start">recover.py</text>
<text x="470" y="508" class="m" font-size="16" fill="#4a5c69" text-anchor="start">--state: log row,</text>
<text x="470" y="532" class="m" font-size="16" fill="#4a5c69" text-anchor="start">uncommitted, last 5</text>
<text x="470" y="556" class="m" font-size="16" fill="#4a5c69" text-anchor="start">commits, compactions</text>
<path d="M1220 495H1158" fill="none" stroke="#4a5c69" stroke-width="2.5" marker-end="url(#fg)"/>
<path d="M850 495H788" fill="none" stroke="#4a5c69" stroke-width="2.5" marker-end="url(#fg)"/>
<path d="M615 420C615 380 1000 380 1205 400" fill="none" stroke="#0072a8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#fa)"/>
<text x="800" y="372" class="m" font-size="15" fill="#4a5c69" text-anchor="middle">back to work, same step</text>
<path d="M80 660H1492L1520 688V810H80Z" fill="#ffffff" stroke="#1aa6df" stroke-width="2"/>
<text x="110" y="712" class="m" font-size="26" fill="#13212b" font-weight="bold" text-anchor="start">git = memory</text>
<text x="110" y="748" class="m" font-size="18" fill="#13212b" text-anchor="start">origin/&lt;branch&gt;  ·  docs/handoff.md (state, next step)  ·  commits end with “Siguiente: …”</text>
<text x="110" y="782" class="m" font-size="16" fill="#4a5c69" text-anchor="start">push at every stable point · never more than 30–45 min unpushed · WIP: commits if red</text>
<path d="M1370 520V652" fill="none" stroke="#1aa6df" stroke-width="2.5" marker-end="url(#fo)"/>
<text x="1385" y="600" class="m" font-size="18" fill="#1aa6df" font-weight="bold" text-anchor="start">push</text>
<path d="M200 660V348" fill="none" stroke="#1aa6df" stroke-width="2.5" marker-end="url(#fo)"/>
<text x="215" y="580" class="m" font-size="18" fill="#1aa6df" font-weight="bold" text-anchor="start">next session</text>
<text x="215" y="604" class="m" font-size="15" fill="#4a5c69" text-anchor="start">tokens · container</text>
<text x="215" y="626" class="m" font-size="15" fill="#4a5c69" text-anchor="start">· account change</text>
</svg>
