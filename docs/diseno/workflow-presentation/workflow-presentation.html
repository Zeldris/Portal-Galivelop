<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galivelop-workflow, step by step</title>
<meta name="description" content="Animated presentation of Galivelop-workflow v0.5.0: one task from the session hook to the published web, as the real scripts and hooks run it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg0:#06121b; --bg1:#0e2a42; --agent:#38b6e8; --script:#4cc38a; --person:#f2b34a; --reject:#f0716a;
  --muted:#8a9bb0; --fg:#eef6fb; --ci:#a9b8d4; --panel:rgba(255,255,255,.045); --line:rgba(238,246,251,.14);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --gutter:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --radius:12px; --dur:520ms; --fs:16; color-scheme:dark;
}
@media (prefers-reduced-motion: reduce){ :root{--dur:0ms} }
:root.noanim{--dur:0ms}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg0) radial-gradient(120% 90% at 50% -10%,var(--bg1),var(--bg0) 70%) fixed;color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-block:0 16px;padding-left:var(--gutter);padding-right:var(--gutter-r);display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:14px 8px}
h1{font-size:clamp(17px,2.2vw,22px);margin:0;font-weight:600;letter-spacing:.01em}
h1 small{color:var(--muted);font-weight:500;font-size:.75em;margin-left:.5em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-left:auto}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
.lang{display:flex;gap:4px;margin-left:8px}
.lang button{font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--fg);border-color:var(--agent);background:rgba(56,182,232,.12)}
.lang button:focus-visible,.ctl button:focus-visible,.chapters button:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
main{display:grid;grid-template-columns:1fr;gap:14px;flex:1;align-content:start}
@media (min-width:960px){ main{grid-template-columns:3fr 2fr;align-items:start} }
.scene{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;min-width:0}
.scene svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--sans)}
.scene text{fill:var(--fg);font-size:calc(var(--fs) * 1px)}
.scene text.m{font-family:var(--mono);font-size:calc(var(--fs) * .95px)}
.scene text.mu{fill:var(--muted)}
.scene.narrow .node text.mu,.scene.narrow #badges{display:none}
.scene text.sm{font-size:calc(var(--fs) * .9px)}
.scene .lane-line{stroke:var(--line);stroke-width:1.4}
.scene .lane-glow{fill:var(--person);opacity:0;transition:opacity var(--dur)}
.scene .lane-glow.on{opacity:.14}
.scene .tok{transition:transform var(--dur) cubic-bezier(.4,0,.2,1);}
.scene .tok circle{transition:fill var(--dur)}
.scene .tok .halo{opacity:.35}
.scene .fade{opacity:0;transition:opacity var(--dur)}
.scene .fade.on{opacity:1}
.scene .mv{transition:transform var(--dur) cubic-bezier(.4,0,.2,1)}
.scene .commit{opacity:0;transition:opacity var(--dur),fill var(--dur),stroke var(--dur)}
.scene .commit.u{opacity:1;fill:var(--bg0);stroke:var(--agent);stroke-dasharray:3 2}
.scene .commit.p{opacity:1;fill:var(--agent);stroke:var(--agent);stroke-dasharray:none}
.scene .commit.m{opacity:1;fill:var(--script);stroke:var(--script);stroke-dasharray:none}
.scene .commit.f{opacity:1;fill:var(--reject);stroke:var(--reject);stroke-dasharray:none}
.scene .gate{fill:var(--bg0);stroke:var(--line);stroke-width:1.2;transition:fill var(--dur),stroke var(--dur)}
.scene .gate.on{fill:var(--script);stroke:var(--script)}
.scene .gate.red{fill:var(--reject);stroke:var(--reject)}
.scene .chip rect{fill:var(--bg0);stroke:var(--line);transition:stroke var(--dur),fill var(--dur)}
.scene .chip.run rect{stroke:var(--ci)}
.scene .chip.ok rect{stroke:var(--script);fill:rgba(76,195,138,.18)}
.scene .chip .dot{fill:var(--muted);transition:fill var(--dur)}
.scene .chip.run .dot{fill:var(--ci)}
.scene .chip.ok .dot{fill:var(--script)}
.scene .node circle{fill:var(--bg0);stroke:var(--line);stroke-width:1.5;transition:stroke var(--dur),fill var(--dur)}
.scene .node.on circle{stroke:var(--agent);fill:rgba(56,182,232,.18)}
.scene .node.on.p circle{stroke:var(--person);fill:rgba(242,179,74,.18)}
.scene .node.on.c circle{stroke:var(--ci);fill:rgba(169,184,212,.18)}
.scene .node.on.s circle{stroke:var(--script);fill:rgba(76,195,138,.18)}
.scene .arrow{stroke:var(--muted);stroke-width:1.4;fill:none;marker-end:url(#arr)}
.scene .arrow.red{stroke:var(--reject);marker-end:url(#arr-red)}
.scene .arrow.green{stroke:var(--script);marker-end:url(#arr-green)}
.scene .arrow.amber{stroke:var(--person);marker-end:url(#arr-amber)}
.scene .dash{stroke-dasharray:5 4}
.scene .pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@media (prefers-reduced-motion: reduce){ .scene .pulse{animation:none;opacity:.7} }
:root.noanim .scene .pulse{animation:none;opacity:.7}
.caption{min-width:0;display:flex;flex-direction:column;gap:10px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.kicker .who{display:inline-flex;align-items:center;gap:6px}
.kicker .who::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
h2{font-size:clamp(19px,2.4vw,26px);margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.lines li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;opacity:0;transform:translateY(6px);transition:opacity var(--dur),transform var(--dur);min-width:0}
.lines li.show{opacity:1;transform:none}
.lines li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));margin-top:7px;justify-self:center}
.lines code,.lines .file{font-family:var(--mono);font-size:13px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:inline-block;max-width:100%;overflow-wrap:anywhere;color:var(--fg)}
.lines .note{color:var(--fg);font-size:14px}
.lines .ok{color:var(--script);font-size:14px}
.lines .fail{color:var(--reject);font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.lines .gate{color:var(--script);font-size:14px}
.lines .gate::before{content:"✓ ";}
.say{margin:0;color:var(--muted);font-size:14px;max-width:62ch;opacity:0;transition:opacity var(--dur)}
.say.show{opacity:1}
.src{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:12px 4px;border-top:1px solid var(--line);margin-top:10px}
.ctl button,.chapters button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:36px}
.ctl button[aria-pressed="true"]{border-color:var(--agent)}
#progress{flex:1 1 180px;accent-color:var(--agent);min-width:120px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chapters{display:flex;flex-wrap:wrap;gap:6px;padding-block:6px}
.chapters button{font-size:12px;padding:4px 10px;min-height:30px;color:var(--muted)}
.chapters button[aria-current="true"]{color:var(--fg);border-color:var(--agent)}
.hint{font-size:12px;color:var(--muted);margin:0;flex-basis:100%}
select{font:inherit;color:var(--fg);background:var(--bg0);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
/* record mode */
body.record{padding:0;overflow:hidden;min-height:0;display:grid;background-attachment:scroll}
body.record .top,body.record .ctl,body.record .chapters,body.record .lang,body.record .say,body.record .src,body.record .kicker .no{display:none}
body.record main{gap:0}
body.record .scene{border:0;background:transparent;padding:0}
body.record .caption{justify-content:center}
body.record .lines li.show{opacity:1}
body.record.r16x9{width:1280px;height:720px;--fs:21}
body.record.r16x9 main{grid-template-columns:780px 1fr;height:720px;align-items:center;padding:24px 40px 24px 28px;gap:28px}
body.record.r16x9 h2{font-size:34px}
body.record.r16x9 .lines .note,body.record.r16x9 .lines .ok,body.record.r16x9 .lines .gate{font-size:22px;line-height:1.35}
body.record.r16x9 .lines code,body.record.r16x9 .lines .file,body.record.r16x9 .lines .fail{font-size:19px}
body.record.r16x9 .kicker{font-size:15px}
body.record.r16x9 .lines li{grid-template-columns:22px 1fr;gap:10px}
body.record.r16x9 .lines li::before{width:11px;height:11px;margin-top:10px}
body.record.r9x16{width:1080px;height:1920px;--fs:30}
body.record.r9x16 main{grid-template-columns:1fr;height:1920px;align-content:center;padding:40px 56px;gap:56px}
body.record.r9x16 h2{font-size:52px}
body.record.r9x16 .lines .note,body.record.r9x16 .lines .ok,body.record.r9x16 .lines .gate{font-size:32px;line-height:1.35}
body.record.r9x16 .lines code,body.record.r9x16 .lines .file,body.record.r9x16 .lines .fail{font-size:27px}
body.record.r9x16 .kicker{font-size:22px}
body.record.r9x16 .lines li{grid-template-columns:30px 1fr;gap:14px}
body.record.r9x16 .lines li::before{width:15px;height:15px;margin-top:16px}
body.record.r9x16 .lines{gap:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

  <g id="git" class="fade on">
   <text class="mu" x="116" y="315" text-anchor="end">${esc(S.branch)}</text><line x1="${X0}" y1="310" x2="792" y2="310" stroke="var(--agent)" stroke-width="1.6" opacity=".7"/>
   <text class="mu" x="116" y="375" text-anchor="end">${esc(S.main)}</text><line x1="${X0}" y1="370" x2="792" y2="370" stroke="var(--fg)" stroke-width="1.6" opacity=".55"/>
   <g class="fade" id="sub"><path d="M150,310 L168,328 H214 L232,310" fill="none" stroke="var(--agent)" stroke-width="1.2" opacity=".7"/><path d="M158,310 L176,342 H206 L224,310" fill="none" stroke="var(--agent)" stroke-width="1.2" opacity=".7"/><text class="m sm mu" x="246" y="346">${esc(S.sub)}</text></g>
   <g class="fade" id="subc"><circle cx="191" cy="328" r="5" fill="var(--agent)"/><circle cx="191" cy="342" r="5" fill="var(--agent)"/></g>
   ${commits}
   <g class="fade" id="push"><path class="arrow" d="M250,298 V278"/></g>
   <g class="fade" id="merge"><path class="arrow green" d="M690,310 C720,310 720,370 740,370"/><circle cx="745" cy="370" r="7" fill="var(--script)"/></g>
   <g class="fade" id="pub"><circle cx="776" cy="370" r="11" fill="none" stroke="var(--script)" stroke-width="1.6"/><ellipse cx="776" cy="370" rx="5" ry="11" fill="none" stroke="var(--script)" stroke-width="1.2"/><line x1="765" y1="370" x2="787" y2="370" stroke="var(--script)" stroke-width="1.2"/><text class="sm" x="792" y="402" text-anchor="end" fill="var(--script)">${esc(S.pub)}</text></g>
  </g>
  <g id="loop" class="fade">
   <path class="arrow" d="M130,332 H270"/><path class="arrow" d="M310,332 H470"/><path class="arrow" d="M510,332 H660"/>
   <path class="arrow" d="M672,348 C652,382 560,372 480,392"/><path class="arrow" d="M454,410 C320,430 40,440 94,352"/>
   ${loop}
   <g class="fade" id="badges"><text class="m sm" x="110" y="372" text-anchor="middle" fill="var(--agent)">vX.Y.Z</text></g>
  </g>
  <g class="tok" id="tok"><circle class="halo" r="16" fill="var(--agent)"/><circle r="9" fill="var(--agent)" stroke="var(--bg0)" stroke-width="2"/></g>
  </svg>`;
  fitScene();
}
function fitScene(){
  const w=$('scene').clientWidth||800;
  const target=recordMode?(recordMode==='9x16'?30:21):14;
  const fs=Math.min(32,Math.max(14,target*800/w));
  root.style.setProperty('--fs',fs.toFixed(1));
  $('scene').classList.toggle('narrow',fs>22);
}
const on=(id,v)=>$(id).classList.toggle('on',!!v);
let prevScene={};
function applyScene(s,instant){
  subTimers.forEach(clearTimeout);subTimers=[];
  const stagger=instant?0:1;
  const x=X0+s.x*(X1-X0),y=LANES[s.lane];
  const tok=$('tok');tok.setAttribute('transform',`translate(${x},${y})`);
  tok.querySelectorAll('circle').forEach(c=>c.setAttribute('fill',COLORS[s.lane]));
  on('glow',s.person);
  on('cut',s.cut);on('compact',s.compact);on('lock',s.lock);on('review',s.review);
  on('relayarrow',s.relay);
  const log=$('log');on('log',s.doc||s.relay);
  log.setAttribute('transform',s.relay?'translate(470,40)':`translate(${x+26},${y-2})`);
  const card=$('card');on('card',s.card);
  card.setAttribute('transform',s.card===2?'translate(470,182)':`translate(${x+22},${y})`);
  on('stamp',s.stamp===1||s.stamp===2);$('stamp-t').textContent=s.stamp===2?T[lang].scene.toMain:T[lang].scene.approve;
  // commits
  const c=s.c||'';let k=0;
  SLOTS.forEach((_,i)=>{const el=$('c'+i),st=c[i]||'.';const was=(prevScene.c||'')[i]||'.';
    el.classList.remove('u','p','m','f');
    if(st!=='.'){el.classList.add(st);el.style.transitionDelay=(st!==was&&was==='.')?`${(k++)*260*stagger}ms`:'0ms';}
    on('f'+i,st==='m');});
  on('push',s.push);on('sub',s.sub>=1);on('subc',s.sub>=2);
  on('merge',s.merge);on('pub',s.pub);
  // gates
  const n=s.gates||0,pn=prevScene.gates||0;let j=0;
  GATES.forEach((_,i)=>{const g=$('g'+i);const lit=i<n;
    g.style.transitionDelay=(lit&&i>=pn)?`${(j++)*300*stagger}ms`:'0ms';
    g.classList.toggle('on',lit&&s.red!==i);g.classList.toggle('red',s.red===i);});
  const gl=$('gate-l');
  if(n&&n<GATES.length){const gi=s.red!=null?s.red:n-1;gl.textContent=GATES[gi];gl.setAttribute('x',Math.min(690,Math.max(300,GX(gi))));gl.setAttribute('fill',s.red!=null?'var(--reject)':'var(--script)');}else gl.textContent='';
  on('allgreen',n===GATES.length);
  on('reject',s.reject);
  if(s.reject){const gx=GX(s.red);$('reject-p').setAttribute('d',`M${gx},112 C${gx},80 ${gx-50},62 ${gx-80},52`);
    const t=$('reject-t');t.setAttribute('x',gx-14);t.setAttribute('y',76);}
  // CI chips
  ['ci','pages'].forEach((kk,i)=>{const ch=$('chip'+i);const v=s[kk]||'idle';ch.classList.remove('run','ok');
    if(v==='ok'&&prevScene[kk]!=='ok'&&!instant){ch.classList.add('run');subTimers.push(setTimeout(()=>{ch.classList.remove('run');ch.classList.add('ok');},1400));}
    else if(v!=='idle')ch.classList.add(v);});
  // chapter 10 loop
  const L=s.loop||0;on('git',!L);$('gates').style.opacity=L?0:1;$('chip0').style.opacity=L?0:1;$('chip1').style.opacity=L?0:1;on('loop',L);
  for(let i=0;i<5;i++){const nd=$('n'+i);nd.classList.remove('on','p','c','s');
    const act=(L===1&&i===1)||(L===2&&i===2)||(L===3&&i===3)||(L===4&&(i===4||i===0));
    if(act){nd.classList.add('on');if(s.lane==='P')nd.classList.add('p');if(s.lane==='C')nd.classList.add('c');}}
  on('badges',L===4);
  prevScene=s;
}

// ---- caption -----------------------------------------------------------
function dur(i){const b=T[lang].beats[i];const n=recordMode?b.b.length:b.l.length;return (recordMode?3200+1600*n:2600+1500*n)/speed;}
function render(i,instant){
  idx=Math.max(0,Math.min(SC.length-1,i));
  clearTimeout(timer);subTimers.forEach(clearTimeout);
  const L=T[lang],d=SC[idx],b=L.beats[idx];
  if(instant||reduced)root.classList.add('noanim');
  $('ch-no').textContent=`${L.ui.chapter} ${d.ch}/10`;$('ch-name').textContent=L.chapters[d.ch-1];
  const who=$('who');who.textContent=L.ui.legend[d.a];who.style.setProperty('--c',COLORS[d.a]);
  $('beat-no').textContent=`${L.ui.step} ${idx+1} ${L.ui.of} ${SC.length}`;
  $('beat-title').textContent=b.t;
  const lines=recordMode?b.b.map(t=>[d.a,'note',t]):b.l;
  $('panel').innerHTML=lines.map(([w,k,t])=>`<li style="--c:${COLORS[w]}">${k==='cmd'?`<code>${esc(t)}</code>`:k==='file'?`<span class="file">${esc(t)}</span>`:`<span class="${k}">${esc(t)}</span>`}</li>`).join('');
  $('narration').textContent=b.s;$('source').textContent=d.src;
  const items=[...$('panel').children],say=$('narration');
  const step=(recordMode?1600:1500)/speed;
  if(instant||reduced){items.forEach(li=>li.classList.add('show'));say.classList.add('show');}
  else{items.forEach((li,n)=>subTimers.push(setTimeout(()=>li.classList.add('show'),400+n*step)));subTimers.push(setTimeout(()=>say.classList.add('show'),400+items.length*step*.6));}
  applyScene(d.s,instant||reduced);
  if(instant||reduced){void root.offsetWidth;requestAnimationFrame(()=>root.classList.remove('noanim'));}
  $('progress').value=idx;$('meta').textContent=`${idx+1}/${SC.length} · ${Math.round(dur(idx)/1000)} s`;
  [...$('chapters').children].forEach((bt,n)=>bt.setAttribute('aria-current',n===d.ch-1?'true':'false'));
  document.dispatchEvent(new CustomEvent('gw:beat',{detail:{index:idx,chapter:d.ch}}));
  if(playing)schedule();
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{if(idx<SC.length-1)render(idx+1);else{pause();document.dispatchEvent(new CustomEvent('gw:end'));}},dur(idx));}
function play(){playing=true;$('play').textContent=T[lang].ui.pause;$('play').setAttribute('aria-pressed','true');schedule();}
function pause(){playing=false;clearTimeout(timer);$('play').textContent=T[lang].ui.play;$('play').setAttribute('aria-pressed','false');}
function goTo(i){render(i,!playing);}
function goChapter(n){const i=SC.findIndex(d=>d.ch===n);if(i>=0)goTo(i);}

// ---- language ----------------------------------------------------------
function setLang(l){
  if(!T[l])return;lang=l;root.lang=l;try{localStorage.setItem('gw-lang',l);}catch(e){}
  const U=T[l].ui;
  $('h1').firstChild.textContent=U.title+' ';$('h1s').textContent=U.sub;
  Object.entries(U.legend).forEach(([k,v])=>$('lg-'+k.toLowerCase()).textContent=v);
  $('prev').setAttribute('aria-label',U.prev);$('next').setAttribute('aria-label',U.next);$('progress').setAttribute('aria-label',U.step);
  $('speed').setAttribute('aria-label',U.speed);$('rec').setAttribute('aria-label',U.rec);$('hint').textContent=U.hint;
  $('lang').setAttribute('aria-label',U.lang);$('chapters').setAttribute('aria-label',U.chapters);
  $('play').textContent=playing?U.pause:U.play;
  [...$('lang').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l?'true':'false'));
  $('chapters').innerHTML=T[l].chapters.map((c,n)=>`<button type="button" data-ch="${n+1}">${n+1}. ${esc(c)}</button>`).join('');
  prevScene={};buildScene();render(idx,true);
}

// ---- controls ----------------------------------------------------------
$('progress').max=SC.length-1;
$('progress').addEventListener('input',e=>goTo(+e.target.value));
$('prev').addEventListener('click',()=>goTo(idx-1));$('next').addEventListener('click',()=>goTo(idx+1));
$('play').addEventListener('click',()=>playing?pause():(idx===SC.length-1?(render(0,false),play()):play()));
$('speed').addEventListener('change',e=>{speed=+e.target.value;if(playing)schedule();});
$('rec').addEventListener('click',()=>{location.search='?record=16x9';});
$('chapters').addEventListener('click',e=>{const b=e.target.closest('button[data-ch]');if(b)goChapter(+b.dataset.ch);});
$('lang').addEventListener('click',e=>{const b=e.target.closest('button[data-lang]');if(b)setLang(b.dataset.lang);});
document.addEventListener('keydown',e=>{
  const tag=e.target.tagName;if(tag==='SELECT'||tag==='INPUT')return;
  if(e.key==='ArrowRight'){goTo(idx+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){goTo(idx-1);e.preventDefault();}
  else if(e.key===' '&&tag!=='BUTTON'){playing?pause():play();e.preventDefault();}
  else if(e.key==='Home'){goTo(0);}else if(e.key==='End'){goTo(SC.length-1);}
  else if(/^[0-9]$/.test(e.key)){goChapter(e.key==='0'?10:+e.key);}
});
addEventListener('resize',fitScene);
window.gwPresentation={get index(){return idx;},get count(){return SC.length;},get lang(){return lang;},chapters:()=>T[lang].chapters,
  durations:()=>SC.map((_,i)=>dur(i)),total:()=>SC.reduce((a,_,i)=>a+dur(i),0),goTo,play,pause,setSpeed:v=>{speed=v;if(playing)schedule();},setLang};
setLang(lang);
if(recordMode&&!reduced)play();
</script>
</body>
