<!doctype html>
<!-- Portada social del portal (og:image, 1200×630; recurso 24 del portal, q1150): la rosa de los vientos flotando en el
     mar grabado (fuentes/portal/og-base.png), con el texto en la mitad izquierda sobre un velo oscuro, como las de los
     proyectos. La renderiza tools/og/portal.mjs a public/marca/galivelop-portal.jpg (?l=gl y ?l=en:
     galivelop-portal-gl.jpg y -en.jpg, para las páginas en gallego e inglés). -->
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Big Shoulders Display";src:url("../../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2") format("woff2-variations");font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");font-weight:100 800}
@font-face{font-family:"Literata";src:url("../../node_modules/@fontsource-variable/literata/files/literata-latin-wght-normal.woff2") format("woff2-variations");font-weight:200 900}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,20,30,.88) 0%,rgba(8,20,30,.74) 38%,rgba(8,20,30,0) 62%)}
.marca{position:absolute;left:62px;top:52px;display:flex;align-items:center;gap:14px;font:600 22px/1 "JetBrains Mono",monospace;color:#f6f1e8}
.marca svg{width:42px;height:42px}
h1{position:absolute;left:60px;width:620px;font:800 66px/70px "Big Shoulders Display",sans-serif;color:#f6f1e8}
hr{position:absolute;left:62px;width:54px;height:3px;border:0}
p{position:absolute;left:62px;width:520px;font:400 23px/35px "Literata",serif;color:#d6dde2}
body{background:url("fuentes/portal/og-base.png")}
body::before{background:linear-gradient(90deg,rgba(8,20,30,.9) 0%,rgba(8,20,30,.78) 40%,rgba(8,20,30,0) 64%)}
.ante{position:absolute;left:62px;top:142px;padding-left:50px;font:500 16px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:rgba(246,241,232,.85)}
.ante::before{content:"";position:absolute;left:0;top:50%;width:36px;height:2px;background:#5d7a6a}
h1{top:178px;width:640px;font-size:64px;line-height:66px;text-transform:uppercase}
p{top:400px;width:560px;font-size:21px;line-height:32px}
.pie{position:absolute;left:62px;bottom:44px;font:400 15px/1 "JetBrains Mono",monospace;letter-spacing:.04em;color:rgba(246,241,232,.75)}
</style></head><body>
<div class="marca"><svg viewBox="0 0 128 128" aria-hidden="true"><path d="M0 0H100L128 28V128H0Z" fill="#1AA6DF"/><g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M55.4 45.6 A24 24 0 1 0 64 64"/><path d="M50 64 H80"/><path d="M71 40 L89.5 88 L108 40"/></g></svg> Galivelop</div>
<div class="ante" id="ante"></div><h1 id="titulo"></h1><p id="lema"></p>
<div class="pie">zeldris.github.io/Portal-Galivelop · Galicia + Develop</div>
<script>
// El titular, el mismo que el de la portada (src/i18n/textos.ts).
const TEXTOS = {
  es: ['Taller independiente de software', 'Hacemos reales<br>los proyectos que<br>parecen imposibles',
    'Un RPG que vive por su cuenta, un verificador de noticias, un flujo de trabajo con agentes de IA… Creamos a la vista y con la puerta abierta.'],
  gl: ['Obradoiro independente de software', 'Facemos reais<br>os proxectos que<br>semellan imposibles',
    'Un RPG que vive pola súa conta, un verificador de novas, un fluxo de traballo con axentes de IA… Creamos á vista e coa porta aberta.'],
  en: ['Independent software workshop', 'We make<br>seemingly impossible<br>projects real',
    'An RPG that lives on its own, a news checker, a workflow with AI agents… We build in plain sight, with the door open.'],
};
const pedido = new URLSearchParams(location.search).get('l');
const l = TEXTOS[pedido] ? pedido : 'es';
document.documentElement.lang = l;
[ante.textContent, titulo.innerHTML, lema.textContent] = TEXTOS[l];
</script>
</body></html>
