<!doctype html>
<!-- Imagen de presentación de Galivelop-workflow (1200×630): la renderiza tools/og/presentacion.mjs a og-fuente.png y
     presentacion.webp (?l=gl y ?l=en: og-fuente-gl.png y og-fuente-en.png, la vista previa de las páginas en gallego e
     inglés; el collage usa la de castellano). Identidad de docs/marca.md, al estilo de tools/og/portal.html: bloque celeste hondo plano con
     isobatas, sin degradados ni resplandores; marca arriba a la izquierda, titular y lema a la izquierda y, a la
     derecha, el relevo como cinco fichas con chaflán. -->
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Big Shoulders Display";src:url("../../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2") format("woff2-variations");font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");font-weight:100 800}
@font-face{font-family:"Literata";src:url("../../node_modules/@fontsource-variable/literata/files/literata-latin-wght-normal.woff2") format("woff2-variations");font-weight:200 900}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#0072a8;color:#fff;font-family:"Literata",serif}
.mar{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left bottom}
.marca{position:absolute;left:52px;top:46px;display:flex;align-items:center;gap:14px;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:21px}
.marca svg{width:44px;height:44px}
h1{position:absolute;left:52px;top:186px;font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:96px;line-height:.9;letter-spacing:.005em;text-transform:uppercase}
h1 em{font-style:normal;display:block;width:fit-content;margin-top:.06em;padding:.05em .14em 0;line-height:1;background:#13212b;color:#fbfcfd}
p{position:absolute;left:54px;top:430px;width:470px;font-size:22px;line-height:1.42;color:rgba(255,255,255,.95)}
.pie{position:absolute;left:54px;bottom:44px;font-family:"JetBrains Mono",monospace;font-size:14px;color:rgba(255,255,255,.8);letter-spacing:.04em}
/* Motivo: el relevo. Cinco fichas con chaflán, escalonadas y unidas por la ruta; la última, en tinta. */
.relevo{position:absolute;left:640px;top:90px;width:510px;height:470px}
.ruta{position:absolute;inset:0;width:510px;height:470px;overflow:visible}
.ficha{position:absolute;width:140px;height:190px;background:#fbfcfd;color:#13212b;border:0;clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%)}
.ficha b{position:absolute;left:14px;top:14px;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:13px;letter-spacing:.06em;color:#4a5c69}
.ficha span{position:absolute;left:14px;bottom:14px;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:15px;letter-spacing:.02em}
.ficha:before{content:"";position:absolute;left:14px;right:14px;bottom:44px;border-top:1px dashed #b9cbd6}
.t1{left:0;top:230px}
.t2{left:92px;top:190px}
.t3{left:184px;top:150px}
.t4{left:276px;top:110px}
.t5{left:368px;top:70px;background:#13212b;color:#fff}
.t5 b{color:rgba(255,255,255,.7)}
.t5:before{border-color:rgba(255,255,255,.35)}
</style></head><body>
<img class="mar" src="../../public/marca/isobatas.svg" alt="">
<div class="marca"><svg viewBox="0 0 128 128" aria-hidden="true"><path d="M0 0H100L128 28V128H0Z" fill="#1AA6DF"/><g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M55.4 45.6 A24 24 0 1 0 64 64"/><path d="M50 64 H80"/><path d="M71 40 L89.5 88 L108 40"/></g></svg>galivelop-workflow</div>
<h1 id="titulo">Relevos sin<em>perder nada.</em></h1>
<p id="lema">La forma de trabajar con agentes de IA, empaquetada: bitácora, check y revisión antes de publicar.</p>
<div class="pie">handoff.md · /gw-selector · check · /code-review · main</div>
<div class="relevo">
  <svg class="ruta" viewBox="0 0 510 470"><path d="M20 470 L488 36" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 7"/><circle cx="488" cy="36" r="6" fill="#fff"/></svg>
  <div class="ficha t1"><b>01</b><span>handoff.md</span></div>
  <div class="ficha t2"><b>02</b><span>/gw-selector</span></div>
  <div class="ficha t3"><b>03</b><span>check ✓</span></div>
  <div class="ficha t4"><b>04</b><span>/code-review</span></div>
  <div class="ficha t5"><b>05</b><span>→ main</span></div>
</div>
<script>
const TEXTOS = {
  gl: ['Relevos sen<em>perder nada.</em>', 'A forma de traballar con axentes de IA, empaquetada: bitácora, check e revisión antes de publicar.'],
  en: ['Hand-offs,<em>nothing lost.</em>', 'A way of working with AI agents, packaged: log, check and review before publishing.'],
};
const l = new URLSearchParams(location.search).get('l');
if (TEXTOS[l]) {
  document.documentElement.lang = l;
  [titulo.innerHTML, lema.textContent] = TEXTOS[l];
}
</script>
</body></html>
