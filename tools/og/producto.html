<!doctype html>
<!-- Vista previa en redes de la página de un producto (og:image, 1200×630): nombre, alias y lema del producto en la mitad
     izquierda, con su color de acento; a la derecha, su portada de fondo o, sin ella, su primera figura (versión
     oscura) enmarcada. Los datos los pone tools/og/producto.mjs (window.DATOS) desde src/data/productos/<slug>.json. -->
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Big Shoulders Display";src:url("../../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2") format("woff2-variations");font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");font-weight:100 800}
@font-face{font-family:"Literata";src:url("../../node_modules/@fontsource-variable/literata/files/literata-latin-wght-normal.woff2") format("woff2-variations");font-weight:200 900}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#08141e center/cover no-repeat;position:relative}
.velo{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,20,30,.92) 0%,rgba(8,20,30,.8) 42%,rgba(8,20,30,0) 66%)}
.figura{position:absolute;right:52px;top:115px;width:520px;height:400px;display:flex;align-items:center;justify-content:center;background:#0d1d2a;clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%)}
.figura img{max-width:92%;max-height:92%}
.marca{position:absolute;left:62px;top:52px;display:flex;align-items:center;gap:14px;font:600 22px/1 "JetBrains Mono",monospace;color:#f6f1e8}
.marca svg{width:42px;height:42px}
.ante{position:absolute;left:62px;top:150px;padding-left:50px;font:500 16px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:rgba(246,241,232,.85)}
.ante::before{content:"";position:absolute;left:0;top:50%;width:36px;height:2px;background:var(--acento)}
h1{position:absolute;left:60px;top:184px;width:600px;font:800 72px/74px "Big Shoulders Display",sans-serif;text-transform:uppercase;color:#f6f1e8}
.alias{display:inline-block;margin-top:14px;padding:6px 12px;border:1.5px solid var(--acento);font:600 18px/1 "JetBrains Mono",monospace;letter-spacing:.06em;color:#f6f1e8}
p{position:absolute;left:62px;top:400px;width:540px;font:400 30px/42px "Literata",serif;color:#d6dde2}
.pie{position:absolute;left:62px;bottom:44px;font:400 15px/1 "JetBrains Mono",monospace;letter-spacing:.04em;color:rgba(246,241,232,.75)}
.pie b{font-weight:600;color:#f6f1e8}
</style></head><body>
<div class="velo"></div>
<div class="marca"><svg viewBox="0 0 128 128" aria-hidden="true"><path d="M0 0H100L128 28V128H0Z" fill="#1AA6DF"/><g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M55.4 45.6 A24 24 0 1 0 64 64"/><path d="M50 64 H80"/><path d="M71 40 L89.5 88 L108 40"/></g></svg> Galivelop</div>
<div class="ante" id="ante"></div><h1 id="titulo"></h1><p id="lema"></p>
<div class="pie" id="pie"></div>
<script>
// Lo pinta tools/og/producto.mjs con window.pintar(datos) una vez cargada la página.
const TEXTOS = {
  es: { ante: 'Producto de Galivelop', estado: { proximamente: 'Próximamente', disponible: 'Disponible' } },
  gl: { ante: 'Produto de Galivelop', estado: { proximamente: 'Proximamente', disponible: 'Dispoñible' } },
  en: { ante: 'A Galivelop product', estado: { proximamente: 'Coming soon', disponible: 'Available' } },
};
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
window.pintar = ({ l, nombre, alias, frases, acento, estado, fondo, figura }) => {
  const t = TEXTOS[l];
  document.documentElement.lang = l;
  document.body.style.setProperty('--acento', acento);
  if (fondo) document.body.style.backgroundImage = `url("${fondo}")`;
  if (figura) document.body.insertAdjacentHTML('beforeend', `<div class="figura"><img src="${figura}" alt=""></div>`);
  ante.textContent = t.ante;
  titulo.innerHTML = esc(nombre) + (alias ? `<br><span class="alias">${esc(alias)}</span>` : '');
  lema.innerHTML = frases.map(esc).join('<br>');
  pie.innerHTML = `${t.estado[estado] ? `<b>${t.estado[estado]}</b> · ` : ''}zeldris.github.io/Portal-Galivelop`;
};
</script>
</body></html>
