<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Before and after: two images side by side. Put both images in medios/fuente/ and write their file names in
     the two src attributes (relative to this folder, e.g. antes.png); an image that does not load makes the
     render fail. The images are cropped to fill their half (object-fit: cover); use screenshots of the same
     size. Fill every gap written between double braces. -->
<meta name="gw-size" content="1200x675">
<title>Antes y después</title>
<style>
  :root {
    /* Palette: override these to match the project (brand colors, dark or light). Nothing else needs to change. */
    --fondo: #0f172a; --superficie: #1e293b; --borde: #334155;
    --texto: #f1f5f9; --tenue: #94a3b8; --acento: #38bdf8; --acento-texto: #0f172a;
    --bien: #4ade80; --mal: #f87171;
    --fuente: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Liberation Sans", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 675px; overflow: hidden; background: var(--fondo); color: var(--texto); font-family: var(--fuente);
         padding: 36px 40px 28px; display: flex; flex-direction: column; }
  h1 { font-size: 34px; margin-bottom: 20px; }
  .par { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; min-height: 0; }
  figure { position: relative; border: 2px solid var(--borde); border-radius: 14px; overflow: hidden; background: var(--superficie); min-height: 0; }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { position: absolute; left: 14px; top: 14px; padding: 6px 16px; border-radius: 999px; font-size: 20px; font-weight: 700;
               background: var(--fondo); color: var(--texto); border: 2px solid var(--borde); }
  figure.despues figcaption { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
  .pie { margin-top: 16px; font-size: 20px; color: var(--tenue); }
</style>
</head>
<body>
  <h1>{{qué cambia}}</h1>
  <div class="par">
    <figure><img src="{{antes.png}}" alt=""><figcaption>{{Antes}}</figcaption></figure>
    <figure class="despues"><img src="{{despues.png}}" alt=""><figcaption>{{Después}}</figcaption></figure>
  </div>
  <div class="pie">{{una frase: la diferencia que se nota}}</div>
</body>
</html>
