<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Quote card: one sentence with its author and where it comes from. Only quote what is written in the source,
     word for word, and give the source in ficha.md. Fill every gap written between double braces. -->
<meta name="gw-size" content="1200x675">
<title>Cita</title>
<style>
  :root {
    /* Palette: override these to match the project (brand colors, dark or light). Nothing else needs to change. */
    --fondo: #0f172a; --superficie: #1e293b; --borde: #334155;
    --texto: #f1f5f9; --tenue: #94a3b8; --acento: #38bdf8; --acento-texto: #0f172a;
    --bien: #4ade80; --mal: #f87171;
    --fuente: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Liberation Sans", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 675px; overflow: hidden; background: var(--fondo); color: var(--texto); font-family: var(--fuente);
         padding: 64px 96px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  body::before { content: "\201C"; position: absolute; left: 56px; top: 20px; font-size: 220px; line-height: 1; color: var(--acento); opacity: .35; }
  blockquote { font-size: 46px; line-height: 1.25; font-weight: 600; max-width: 960px; position: relative; }
  .autor { margin-top: 40px; display: flex; align-items: center; gap: 18px; font-size: 24px; }
  .autor::before { content: ""; width: 56px; height: 4px; border-radius: 2px; background: var(--acento); }
  .autor b { color: var(--texto); }
  .autor span { color: var(--tenue); }
  .pie { position: absolute; left: 96px; right: 96px; bottom: 40px; display: flex; justify-content: space-between; font-size: 20px; color: var(--tenue); }
</style>
</head>
<body>
  <blockquote>{{la cita, literal}}</blockquote>
  <div class="autor"><b>{{quién lo dijo}}</b><span>{{dónde o cuándo}}</span></div>
  <div class="pie"><span>{{proyecto}}</span><span>{{fecha}}</span></div>
</body>
</html>
