<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Release card: a headline, one sentence and three figures. For X, LinkedIn and Discord. Copy one per language
     (tarjeta.es.html, tarjeta.en.html), fill every gap written between double braces, keep the figures true and
     sourced in ficha.md, and render with render.mjs. To drop a figure, delete its div.cifra. -->
<meta name="gw-size" content="1200x675">
<title>Tarjeta</title>
<style>
  :root {
    /* Palette: override these to match the project (brand colors, dark or light). Nothing else needs to change. */
    --fondo: #0f172a; --superficie: #1e293b; --borde: #334155;
    --texto: #f1f5f9; --tenue: #94a3b8; --acento: #38bdf8; --acento-texto: #0f172a;
    --bien: #4ade80; --mal: #f87171;
    --fuente: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Liberation Sans", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 675px; overflow: hidden; background: var(--fondo); color: var(--texto); font-family: var(--fuente);
         padding: 56px 72px; display: flex; flex-direction: column; }
  .marca { font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: var(--acento); font-weight: 700; }
  h1 { font-size: 54px; line-height: 1.1; margin-top: 28px; max-width: 980px; }
  p.sub { font-size: 26px; line-height: 1.35; color: var(--tenue); margin-top: 20px; max-width: 960px; }
  .cifras { display: flex; gap: 22px; margin-top: auto; }
  .cifra { flex: 1; background: var(--superficie); border: 2px solid var(--borde); border-radius: 16px; padding: 20px 24px; }
  .cifra b { display: block; font-size: 46px; color: var(--acento); }
  .cifra span { font-size: 20px; color: var(--tenue); }
  .pie { display: flex; justify-content: space-between; margin-top: 26px; font-size: 20px; color: var(--tenue); }
</style>
</head>
<body>
  <div class="marca">{{proyecto}}</div>
  <h1>{{titular}}</h1>
  <p class="sub">{{una frase: qué puede hacer ahora quien lo usa}}</p>
  <div class="cifras">
    <div class="cifra"><b>{{cifra}}</b><span>{{qué mide}}</span></div>
    <div class="cifra"><b>{{cifra}}</b><span>{{qué mide}}</span></div>
    <div class="cifra"><b>{{cifra}}</b><span>{{qué mide}}</span></div>
  </div>
  <div class="pie"><span>{{fecha}}</span><span>{{enlace corto o nombre del proyecto}}</span></div>
</body>
</html>
