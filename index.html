<!doctype html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galivelop</title>
    <meta name="description" content="Galivelop: software con raíces gallegas. Todos nuestros proyectos, publicados y en desarrollo: Tarkor, toVeriAI y más." />
    <meta name="theme-color" content="#06121C" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%marca/gd-logo.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%marca/gd-logo-512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Galivelop" />
    <meta property="og:description" content="Software con raíces gallegas. Proyectos publicados y en desarrollo." />
    <meta property="og:image" content="%BASE_URL%marca/galivelop-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
      try {
        var t = localStorage.getItem('galivelop.tema');
        if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
