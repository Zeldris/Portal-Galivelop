    <meta property="og:site_name" content="Galivelop" />
    <meta property="og:url" content="https://zeldris.github.io/Portal-Galivelop/" />

    <meta property="og:description" content="Hacemos reales los proyectos que parecen imposibles: un RPG con IA local y una herramienta que mide la credibilidad de las noticias." />

    <script>
      // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
      try {
        var t = localStorage.getItem('galivelop.tema');
        if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
